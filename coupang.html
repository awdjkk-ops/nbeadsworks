<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿠팡 - 준비 중</title>
<style>
  :root{
    --ink:#22262b;
    --muted:#6b7280;
    --bg:#f4f2ee;
    --card:#ffffff;
    --accent:#a8425c;
    --accent-dark:#7f2f45;
    --line:#e4e0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:48px 16px 64px;
  }
  .wrap{max-width:520px;margin:0 auto;text-align:center;}
  a.back{
    display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);
    text-decoration:none;margin-bottom:24px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:48px 28px;
  }
  .icon{font-size:40px;margin-bottom:12px;}
  h1{font-size:20px;margin:0 0 10px;}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 쇼핑몰 선택으로 돌아가기</a>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>쿠팡 도구는 준비 중이에요</h1>
    <p>쿠팡 원본 주문 파일 샘플을 주시면<br>CAFE24 도구처럼 만들어드릴 수 있어요.</p>
  </div>
</div>
</body>
</html>
