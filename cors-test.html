<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 다운로드 가능 여부 테스트</title>
<style>
  body{font-family:-apple-system,sans-serif;max-width:600px;margin:40px auto;padding:0 16px;color:#22262b;}
  h1{font-size:20px;}
  .field{margin-bottom:16px;}
  input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;}
  button{background:#a8425c;color:#fff;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;}
  .result{margin-top:20px;padding:14px;border-radius:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
  .ok{background:#eaf5ef;color:#2f7d5a;}
  .fail{background:#fbeceb;color:#a4342a;}
  img{max-width:100%;margin-top:12px;border:1px solid #ddd;}
</style>
</head>
<body>
  <h1>🧪 이미지 다운로드 가능 여부 테스트</h1>
  <p>상품 사진 URL을 넣고 "테스트" 버튼을 누르면, 이 사진을 합쳐서 파일로 다운로드할 수 있는지 바로 확인돼요.</p>

  <div class="field">
    <input type="text" id="urlInput" placeholder="https://www.beadsmaker.com/web/product/..." value="https://www.beadsmaker.com/web/product/extra/big/202510/e959a2c80519e7bfcff92ec603b93e99.jpg">
  </div>
  <button id="testBtn">테스트</button>

  <div id="result"></div>
  <div id="preview"></div>

<script>
document.getElementById('testBtn').addEventListener('click', () => {
  const url = document.getElementById('urlInput').value.trim();
  const resultEl = document.getElementById('result');
  const previewEl = document.getElementById('preview');
  resultEl.className = 'result';
  resultEl.textContent = '테스트 중...';
  previewEl.innerHTML = '';

  const img = new Image();
  img.crossOrigin = 'anonymous';

  img.onload = () => {
    previewEl.innerHTML = '';
    const thumb = new Image();
    thumb.src = url;
    thumb.style.maxWidth = '200px';
    previewEl.appendChild(thumb);

    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    try {
      const dataUrl = canvas.toDataURL('image/png');
      resultEl.className = 'result ok';
      resultEl.textContent = '✅ 다운로드 가능해요! 이 서버는 이미지 합성/다운로드를 막지 않아요.\n\n실제 다운로드 테스트도 해보세요:';
      const dlBtn = document.createElement('button');
      dlBtn.textContent = '이 이미지 다운로드해보기';
      dlBtn.style.marginTop = '10px';
      dlBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'test.png';
        a.click();
      };
      resultEl.appendChild(document.createElement('br'));
      resultEl.appendChild(dlBtn);
    } catch (err) {
      resultEl.className = 'result fail';
      resultEl.textContent = '❌ 다운로드가 막혀있어요 (' + err.message + ')\n이 경우엔 화면 캡쳐 방식으로 대체해야 해요.';
    }
  };

  img.onerror = () => {
    resultEl.className = 'result fail';
    resultEl.textContent = '❌ 이미지 자체를 못 불러왔어요. URL이 정확한지, 혹은 서버가 외부 요청 자체를 막고 있는지 확인이 필요해요.\n(이 경우도 다운로드 합성 방식은 어려울 가능성이 높아요.)';
  };

  img.src = url;
});
</script>
</body>
</html>
