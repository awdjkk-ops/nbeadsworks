<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑몰 주문 자동화</title>
<style>
  :root{
    --ink:#22262b;
    --muted:#6b7280;
    --bg:#f4f2ee;
    --card:#ffffff;
    --accent:#a8425c;
    --accent-dark:#7f2f45;
    --teal:#3a5a63;
    --line:#e4e0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:48px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:32px;text-align:center;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;letter-spacing:.06em;color:var(--accent-dark);
    background:#f3e3e7;padding:4px 10px;border-radius:20px;
    font-weight:600;
  }
  h1{font-size:26px;margin:14px 0 6px;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0;}

  .grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:32px;
  }
  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:380px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 22px;
    text-decoration:none;
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .card.active:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
    border-color:var(--accent);
  }
  .card.disabled{
    opacity:.55;
    cursor:not-allowed;
  }
  .logo{
    width:52px;height:52px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;
  }
  .logo.cafe24{background:var(--teal);}
  .logo.coupang{background:#b0492f;}
  .logo.etsy{background:#d5641c;}
  .card-title{font-size:16px;font-weight:700;}
  .card-desc{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .badge{
    font-size:11px;font-weight:700;color:var(--accent-dark);
    background:#f3e3e7;padding:2px 8px;border-radius:10px;
  }
  .badge.soon{color:var(--muted);background:#eceae4;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">쇼핑몰 주문 자동화</span>
    <h1>어떤 쇼핑몰 파일을 처리할까요?</h1>
    <p class="sub">쇼핑몰을 선택하면 해당 쇼핑몰 원본 파일에 맞는 도구로 이동해요.</p>
  </header>

  <div class="grid">
    <a href="cafe24.html" class="card active">
      <div class="logo cafe24">24</div>
      <div class="card-title">CAFE24</div>
      <div class="card-desc">변환된 파일 · 택배 발송용 · 라벨 스티커 자동 생성</div>
      <span class="badge">사용 가능</span>
    </a>

    <a href="coupang.html" class="card active">
      <div class="logo coupang">C</div>
      <div class="card-title">쿠팡</div>
      <div class="card-desc">준비 중이에요</div>
      <span class="badge soon">준비 중</span>
    </a>

    <a href="etsy.html" class="card active">
      <div class="logo etsy">E</div>
      <div class="card-title">ETSY</div>
      <div class="card-desc">준비 중이에요</div>
      <span class="badge soon">준비 중</span>
    </a>
  </div>

  <footer>
    파일은 이 브라우저 안에서만 처리되고 서버로 전송되지 않아요.<br>
    <span id="lastUpdated" style="opacity:.8;">최근 업데이트 확인 중...</span>
  </footer>
</div>
<script>
(async ()=>{
  const el = document.getElementById('lastUpdated');
  try{
    const res = await fetch('https://api.github.com/repos/awdjkk-ops/nbeadsworks/commits?per_page=1');
    if(!res.ok) throw new Error('조회 실패');
    const data = await res.json();
    const dateStr = data[0]?.commit?.author?.date;
    if(!dateStr) throw new Error('날짜 없음');
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2,'0');
    const formatted = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    el.textContent = `최근 업데이트: ${formatted}`;
  }catch(err){
    el.textContent = '';
  }
})();
</script>
</body>
</html>
